# Source definitions
# Each source has: name, type, credentials_key (matches secrets/.env), quality_weight, enabled
#
# Source types:
#   local_folder   — watch a folder for .md / .txt files dropped in manually
#   patreon        — scrape Patreon posts via headless browser (requires cookies)
#   youtube        — fetch transcripts via youtube-transcript-api
#   rss            — parse RSS/Atom feed
#   twitter_list   — scrape X/Twitter list (requires cookies or API key)
#   manual         — user pastes content via CLI
#   sec_13f        — SEC 13F institutional holding filings (EDGAR primary, WhaleWisdom optional)

sources:

  # PHASE 1 — enabled by default, no external credentials needed
  - name: local_drop
    type: local_folder
    path: knowledge/raw/drop/
    enabled: true
    quality_weight: 0.7         # treat manually dropped content as high quality
    source_category: discovery

  # PATREON — requires browser cookies (see SETUP.md for Playwright cookie export)
  - name: investanswers_patreon
    type: patreon
    creator_url: https://www.patreon.com/investanswers
    credentials_key: PATREON_COOKIES_FILE   # path to exported cookies JSON
    enabled: false              # enable once cookies configured
    quality_weight: 0.85
    source_category: discovery
    poll_interval_hours: 24
    max_posts_per_run: 10
    include_comments: true      # scrape comments on each post
    comment_days: 2             # only scrape comments on posts from the last N days

  - name: realvision_patreon
    type: patreon
    creator_url: https://www.patreon.com/realvision
    credentials_key: PATREON_COOKIES_FILE
    enabled: false
    quality_weight: 0.80
    source_category: discovery
    poll_interval_hours: 24
    max_posts_per_run: 10
    include_comments: true
    comment_days: 2

  # YOUTUBE — no credentials needed for public videos (transcript API)
  - name: youtube_transcripts
    type: youtube
    channel_ids: []             # add channel IDs here
    playlist_ids: []            # or playlist IDs
    enabled: false
    quality_weight: 0.70
    source_category: discovery
    poll_interval_hours: 24
    include_comments: false     # not implemented for YouTube; comments = euphoria only

  # RSS / NEWSLETTER
  - name: jordi_visser_substack
    type: rss
    url: ""                     # add Substack RSS URL
    enabled: false
    quality_weight: 0.80
    source_category: discovery
    poll_interval_hours: 24

  # SEC 13F FILINGS — institutional holding disclosures
  # Signal type: CONFIRMATION (45-135 day lag)
  # Use to validate theses already in the pipeline, NOT to initiate positions.
  # Requires: EDGAR_USER_AGENT in secrets/.env (format: "Name/App email@domain.com")
  # Optional: WHALEWISDOM_ACCESS_KEY + WHALEWISDOM_SECRET_KEY for enhanced data

  - name: situational_awareness_13f
    type: sec_13f
    filer_slug: situational-awareness-lp  # matches EDGAR filing name
    filer_cik: ""                          # auto-discovered; set to speed up: e.g. "0001802256"
    enabled: false                         # enable after setting EDGAR_USER_AGENT
    edgar_user_agent: ""                   # override env var here or set EDGAR_USER_AGENT in secrets/.env
    quality_weight: 0.45                   # high data accuracy, but 45-135 day lag lowers signal utility
    source_category: confirmation          # NOT discovery — confirms existing theses only
    poll_interval_hours: 168               # weekly poll; filings are quarterly
    include_unchanged: false               # skip unchanged positions in digest (reduces noise)
    max_positions_per_digest: 50           # chunk limit — prevents LLM context overflow
    edgar_fallback: true                   # use SEC EDGAR if WhaleWisdom unavailable
